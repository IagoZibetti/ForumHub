# Application Configuration
spring.application.name=ForumHub

# PostgreSQL Database Configuration
spring.datasource.url=${FORUM_HUB_URL}
spring.datasource.username=${FORUM_HUB_USUARIO}
spring.datasource.password=${FORUM_HUB_SENHA}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=8080
server.error.include-message=always

# JWT Configuration
api.security.token.secret=${JWT_SECRET}
api.security.token.expiration=3000000

# Validation messages in Portuguese
spring.messages.basename=messages
